services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-experience-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_experience
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Ct0520.0402"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_experience"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
